# The Android version Robolectric simulates for a test that does not name one with @Config(sdk=...).
#
# Orbit targets API 36, and without this file Robolectric would default to simulating 36 as well.
# Robolectric 4.16 can only simulate API 36 on a Java 21 test runtime, while Orbit builds and tests
# on JDK 17 (tools/build_orbit.ps1). Pinning the default keeps the whole suite runnable on JDK 17,
# simulating the same API 35 it simulated before the API 36 migration. Raise it to 36 when the
# test runtime moves to Java 21. Real API 36 behaviour is verified on a physical Android 16 device.
sdk=35
