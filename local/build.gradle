plugins {
    id 'com.android.application'
}

// The component is signed by exactly the same permanent Orbit release certificate as the main
// app. That shared identity is what makes the signature-level bind permission meaningful, and
// what lets each side verify the other before trusting it.
def orbitSigningPropertiesFile = rootProject.file('orbit-signing.properties')
def orbitSigningProperties = new Properties()
if (orbitSigningPropertiesFile.exists()) {
    orbitSigningPropertiesFile.withInputStream { orbitSigningProperties.load(it) }
}

def orbitSigningValue = { String name ->
    def localValue = orbitSigningProperties.getProperty(name)
    localValue != null && !localValue.isEmpty() ? localValue : System.getenv(name)
}

def orbitReleaseStoreFile = orbitSigningValue('ORBIT_RELEASE_STORE_FILE')?.trim()
def orbitReleaseKeyAlias = orbitSigningValue('ORBIT_RELEASE_KEY_ALIAS')?.trim()
def orbitReleaseStorePassword = orbitSigningValue('ORBIT_RELEASE_STORE_PASSWORD')
def orbitReleaseKeyPassword = orbitSigningValue('ORBIT_RELEASE_KEY_PASSWORD')
def orbitReleaseSigningReady = [
        orbitReleaseStoreFile,
        orbitReleaseKeyAlias,
        orbitReleaseStorePassword,
        orbitReleaseKeyPassword
].every { it != null && !it.isEmpty() }

android {
    namespace 'com.orbit.assistant.local'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orbit.assistant.local'
        minSdk 29
        targetSdk 35
        // Kept in lockstep with the main app for this release: Orbit installs the component built
        // for its own release, so a mismatched pair cannot occur.
        versionCode 737
        versionName "0.7.7.7-beta.2"

        // The inference runtime ships native libraries per ABI. Only 64-bit ARM is packaged, and
        // this is now the only APK in the project that carries them at all.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (orbitReleaseSigningReady) {
                storeFile file(orbitReleaseStoreFile)
                storePassword orbitReleaseStorePassword
                keyAlias orbitReleaseKeyAlias
                keyPassword orbitReleaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (orbitReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    sourceSets {
        // One copy of the IPC contract, compiled into both sides. Duplicating the .aidl files
        // would let the two ends drift apart silently.
        main.aidl.srcDirs += ['../ipc']
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure {
        doFirst {
            if (!orbitReleaseSigningReady) {
                throw new GradleException('Release signing is not configured. Set all four ORBIT_RELEASE_* values in the ignored orbit-signing.properties file or environment variables.')
            }
        }
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.11.2"
    // The whole reason this module exists: the on-device inference runtime lives here and
    // nowhere else, so an Orbit install without the component never carries it.
    implementation "com.google.mediapipe:tasks-genai:0.10.35"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
}
