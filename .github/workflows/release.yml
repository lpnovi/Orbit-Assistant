name: Release Orbit APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: orbit-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  EXPECTED_PACKAGE_NAME: com.orbit.assistant
  EXPECTED_CERT_SHA256: 7D:AD:61:93:85:DF:F1:1E:C7:31:AA:55:5F:2B:44:8A:94:3C:73:91:81:3D:1A:94:DF:1C:B4:23:2E:CD:41:E3
  EXPECTED_COMPONENT_PACKAGE_NAME: com.orbit.assistant.local
  ORBIT_LOCAL_PROTOCOL: "2"

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and source version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          # Orbit publishes two tag shapes from this one workflow. A Stable tag is v0.7.7.5; a
          # Beta tag is v0.7.7.5-beta.1, where the counter starts at one and carries no leading
          # zero, so one build can never be described by two different tags.
          stable_pattern='^v[0-9]+(\.[0-9]+)+$'
          beta_pattern='^v[0-9]+(\.[0-9]+)+-beta\.[1-9][0-9]*$'
          if [[ "${RELEASE_TAG}" =~ ${stable_pattern} ]]; then
            release_channel="stable"
          elif [[ "${RELEASE_TAG}" =~ ${beta_pattern} ]]; then
            release_channel="beta"
          else
            echo "::error::Requested release tag is malformed."
            exit 1
          fi
          if ! git tag --points-at HEAD | grep -Fxq "${RELEASE_TAG}"; then
            echo "::error::Checked-out source is not the requested release tag."
            exit 1
          fi

          source_version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)"
          source_version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"
          if [[ -z "${source_version_name}" || ! "${source_version_code}" =~ ^[0-9]+$ ||
                "${RELEASE_TAG}" != "v${source_version_name}" ]]; then
            echo "::error::Release tag does not match the tagged source version."
            exit 1
          fi

          # The user-facing title, and the exact string Orbit's own OrbitVersion helper produces.
          if [[ "${release_channel}" == "beta" ]]; then
            base_version="${source_version_name%%-beta.*}"
            beta_number="${source_version_name##*-beta.}"
            display_name="${base_version} Beta ${beta_number}"
            prerelease_flag="true"
          else
            display_name="${source_version_name}"
            prerelease_flag="false"
          fi

          echo "Release channel: ${release_channel}"
          echo "Release title: Orbit Assistant v${display_name}"
          echo "version_name=${source_version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${source_version_code}" >> "${GITHUB_OUTPUT}"
          echo "display_name=${display_name}" >> "${GITHUB_OUTPUT}"
          echo "release_channel=${release_channel}" >> "${GITHUB_OUTPUT}"
          echo "prerelease_flag=${prerelease_flag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare temporary release keystore
        shell: bash
        env:
          ORBIT_RELEASE_KEYSTORE_B64: ${{ secrets.ORBIT_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ORBIT_RELEASE_KEYSTORE_B64:-}" ]]; then
            echo "::error::Release keystore secret is unavailable."
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/orbit-release.jks"
          printf '%s' "${ORBIT_RELEASE_KEYSTORE_B64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          if [[ ! -s "${keystore_path}" ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi

      - name: Build signed release APKs
        shell: bash
        env:
          ORBIT_RELEASE_STORE_FILE: ${{ runner.temp }}/orbit-release.jks
          ORBIT_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_STORE_PASSWORD }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify and prepare release assets
        id: verify
        shell: bash
        env:
          EXPECTED_VERSION_NAME: ${{ steps.source.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.source.outputs.version_code }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${apk_path}" ]]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          build_tools_dir="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="${build_tools_dir}/aapt"
          apksigner="${build_tools_dir}/apksigner"
          if [[ ! -x "${aapt}" || ! -x "${apksigner}" ]]; then
            echo "::error::Required Android APK verification tools are unavailable."
            exit 1
          fi

          package_line="$("${aapt}" dump badging "${apk_path}" | grep -m 1 '^package:')"
          actual_package="$(awk -F"'" '{print $2}' <<< "${package_line}")"
          actual_version_code="$(awk -F"'" '{print $4}' <<< "${package_line}")"
          actual_version_name="$(awk -F"'" '{print $6}' <<< "${package_line}")"

          if [[ "${actual_package}" != "${EXPECTED_PACKAGE_NAME}" ]]; then
            echo "::error::APK package name verification failed."
            exit 1
          fi
          if [[ "${actual_version_name}" != "${EXPECTED_VERSION_NAME}" || "${actual_version_code}" != "${EXPECTED_VERSION_CODE}" ]]; then
            echo "::error::APK version verification failed."
            exit 1
          fi

          signature_report="${RUNNER_TEMP}/orbit-apksigner-report.txt"
          "${apksigner}" verify --verbose --print-certs "${apk_path}" > "${signature_report}" 2>&1
          grep -Ei '^(Verifies|Verified using|Number of signers|Signer #[0-9]+ certificate (DN|SHA-256 digest):)' "${signature_report}" || true
          signer_count="$(grep -ciF 'certificate SHA-256 digest:' "${signature_report}" || true)"
          actual_cert="$(grep -iF 'certificate SHA-256 digest:' "${signature_report}" | head -n 1 | sed 's/.*digest:[[:space:]]*//' || true)"
          normalized_actual_cert="$(tr -d ':' <<< "${actual_cert}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          normalized_expected_cert="$(tr -d ':' <<< "${EXPECTED_CERT_SHA256}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          display_actual_cert="$(sed 's/../&:/g; s/:$//' <<< "${normalized_actual_cert}" | tr '[:lower:]' '[:upper:]')"
          echo "Detected APK signer count: ${signer_count}"
          echo "Detected certificate SHA-256: ${display_actual_cert:-unavailable}"
          if [[ "${signer_count}" != '1' ]]; then
            echo "::error::APK signer-count verification failed."
            exit 1
          fi
          if [[ "${normalized_actual_cert}" != "${normalized_expected_cert}" ]]; then
            echo "::error::APK signing certificate verification failed."
            exit 1
          fi

          # ---- the optional Orbit Local component -------------------------------------------
          # Held to exactly the same standard as the main APK: its own package, its own version,
          # one signer, and the same permanent Orbit certificate. Orbit refuses to install a
          # component that fails any of these, so publishing one would be publishing a dead asset.
          component_apk="local/build/outputs/apk/release/local-release.apk"
          if [[ ! -f "${component_apk}" ]]; then
            echo "::error::Orbit Local component APK was not produced."
            exit 1
          fi
          component_line="$("${aapt}" dump badging "${component_apk}" | grep -m 1 '^package:')"
          component_package="$(awk -F"'" '{print $2}' <<< "${component_line}")"
          component_version_code="$(awk -F"'" '{print $4}' <<< "${component_line}")"
          component_version_name="$(awk -F"'" '{print $6}' <<< "${component_line}")"
          if [[ "${component_package}" != "${EXPECTED_COMPONENT_PACKAGE_NAME}" ]]; then
            echo "::error::Orbit Local component package name verification failed."
            exit 1
          fi
          if [[ "${component_version_name}" != "${EXPECTED_VERSION_NAME}" ||
                "${component_version_code}" != "${EXPECTED_VERSION_CODE}" ]]; then
            echo "::error::Orbit Local component version verification failed."
            exit 1
          fi
          component_report="${RUNNER_TEMP}/orbit-local-apksigner-report.txt"
          "${apksigner}" verify --verbose --print-certs "${component_apk}" > "${component_report}" 2>&1
          component_signers="$(grep -ciF 'certificate SHA-256 digest:' "${component_report}" || true)"
          component_cert="$(grep -iF 'certificate SHA-256 digest:' "${component_report}" | head -n 1 | sed 's/.*digest:[[:space:]]*//' || true)"
          normalized_component_cert="$(tr -d ':' <<< "${component_cert}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [[ "${component_signers}" != '1' ]]; then
            echo "::error::Orbit Local component signer-count verification failed."
            exit 1
          fi
          if [[ "${normalized_component_cert}" != "${normalized_expected_cert}" ]]; then
            echo "::error::Orbit Local component signing certificate verification failed."
            exit 1
          fi

          output_dir="${GITHUB_WORKSPACE}/release-assets"
          output_apk="${output_dir}/Orbit-Assistant-v${EXPECTED_VERSION_NAME}.apk"
          output_component="${output_dir}/Orbit-Local-v${EXPECTED_VERSION_NAME}.apk"
          output_component_checksum="${output_component}.sha256"
          output_checksum="${output_apk}.sha256"
          output_manifest="${output_dir}/orbit-update.json"
          mkdir -p "${output_dir}"
          cp "${apk_path}" "${output_apk}"
          cp "${component_apk}" "${output_component}"
          (
            cd "${output_dir}"
            sha256sum "$(basename "${output_apk}")" > "$(basename "${output_checksum}")"
            sha256sum "$(basename "${output_component}")" > "$(basename "${output_component_checksum}")"
          )

          apk_sha256="$(sha256sum "${output_apk}" | awk '{print $1}')"
          component_sha256="$(sha256sum "${output_component}" | awk '{print $1}')"
          export ACTUAL_PACKAGE="${actual_package}"
          export ACTUAL_VERSION_NAME="${actual_version_name}"
          export ACTUAL_VERSION_CODE="${actual_version_code}"
          export APK_ASSET_NAME="$(basename "${output_apk}")"
          export APK_SHA256="${apk_sha256}"
          export CERTIFICATE_SHA256="${EXPECTED_CERT_SHA256}"
          export COMPONENT_PACKAGE="${component_package}"
          export COMPONENT_VERSION_NAME="${component_version_name}"
          export COMPONENT_VERSION_CODE="${component_version_code}"
          export COMPONENT_ASSET_NAME="$(basename "${output_component}")"
          export COMPONENT_SHA256="${component_sha256}"
          export COMPONENT_SIZE="$(stat -c%s "${output_component}")"
          export COMPONENT_PROTOCOL="${ORBIT_LOCAL_PROTOCOL}"
          export OUTPUT_MANIFEST="${output_manifest}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Schema stays 1, deliberately. Every Orbit already in the field reads exactly these
          # top-level fields and updates normally; "component" is purely additive, and an older
          # updater simply never looks at it.
          manifest = {
              "schema": 1,
              "packageName": os.environ["ACTUAL_PACKAGE"],
              "versionName": os.environ["ACTUAL_VERSION_NAME"],
              "versionCode": int(os.environ["ACTUAL_VERSION_CODE"]),
              "apkAssetName": os.environ["APK_ASSET_NAME"],
              "apkSha256": os.environ["APK_SHA256"],
              "certificateSha256": os.environ["CERTIFICATE_SHA256"],
              "component": {
                  "packageName": os.environ["COMPONENT_PACKAGE"],
                  "versionName": os.environ["COMPONENT_VERSION_NAME"],
                  "versionCode": int(os.environ["COMPONENT_VERSION_CODE"]),
                  "apkAssetName": os.environ["COMPONENT_ASSET_NAME"],
                  "apkSha256": os.environ["COMPONENT_SHA256"],
                  "apkSize": int(os.environ["COMPONENT_SIZE"]),
                  "certificateSha256": os.environ["CERTIFICATE_SHA256"],
                  "protocol": int(os.environ["COMPONENT_PROTOCOL"]),
              },
          }
          Path(os.environ["OUTPUT_MANIFEST"]).write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

          echo "Verified package: ${actual_package}"
          echo "Verified version: ${actual_version_name} (${actual_version_code})"
          echo "Verified certificate SHA-256: ${EXPECTED_CERT_SHA256}"
          echo "apk_path=${output_apk}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${output_checksum}" >> "${GITHUB_OUTPUT}"
          echo "component_path=${output_component}" >> "${GITHUB_OUTPUT}"
          echo "component_checksum_path=${output_component_checksum}" >> "${GITHUB_OUTPUT}"
          echo "manifest_path=${output_manifest}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes from changelog
        id: notes
        shell: bash
        env:
          EXPECTED_VERSION_NAME: ${{ steps.source.outputs.version_name }}
          RELEASE_DISPLAY_NAME: ${{ steps.source.outputs.display_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['EXPECTED_VERSION_NAME']
          # The changelog is keyed by the exact versionName, including any -beta.N suffix, so a
          # Beta release still needs its own entry. Only the heading uses the friendlier form.
          display = os.environ['RELEASE_DISPLAY_NAME']
          marker = f'- **v{version}**:'
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()

          index = next((i for i, line in enumerate(lines) if line.startswith(marker)), None)
          if index is None:
              raise SystemExit(f'No CHANGELOG.md entry found for v{version}')

          summary = lines[index][len(marker):].strip()

          # Indented "  - " lines directly beneath the entry become the What's new bullets, so a
          # release body stays a short summary plus a few bullets rather than one long paragraph.
          bullets = []
          for line in lines[index + 1:]:
              stripped = line.strip()
              if line.startswith('  - ') or line.startswith('    - '):
                  bullets.append(stripped[2:].strip())
                  continue
              if not stripped:
                  continue
              break

          notes = f'## Orbit Assistant v{display}\n\n{summary}\n\n'
          if bullets:
              notes += "### What's new\n\n"
              notes += ''.join(f'- {bullet}\n' for bullet in bullets)
              notes += '\n'
          notes += (
              'This APK is signed with Orbit Assistant\'s permanent release certificate. '
              'The attached `.sha256` file can be used to verify the APK download.\n'
          )

          # User-facing notes stay short. The commit message is never used as the release body.
          body_words = len(summary.split()) + sum(len(b.split()) for b in bullets)
          if body_words > 200:
              raise SystemExit(
                  f'Release notes for v{version} are {body_words} words. Keep the CHANGELOG entry '
                  'under 200 words: a short summary plus 3-6 concise bullets.'
              )
          Path('release-assets/release-notes.md').write_text(notes, encoding='utf-8')
          PY
          echo "notes_path=${GITHUB_WORKSPACE}/release-assets/release-notes.md" >> "${GITHUB_OUTPUT}"

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: Orbit-Assistant-v${{ steps.source.outputs.version_name }}-release
          path: |
            ${{ steps.verify.outputs.apk_path }}
            ${{ steps.verify.outputs.checksum_path }}
            ${{ steps.verify.outputs.component_path }}
            ${{ steps.verify.outputs.component_checksum_path }}
            ${{ steps.verify.outputs.manifest_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION_NAME: ${{ steps.source.outputs.version_name }}
        run: |
          set -euo pipefail
          # A Beta tag is published as a GitHub prerelease and a Stable tag as a normal release.
          # Orbit's updater refuses any release where those two disagree, so the flag is derived
          # from the validated tag rather than passed in by hand.
          prerelease_args=()
          if [[ "${{ steps.source.outputs.prerelease_flag }}" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            "${{ steps.verify.outputs.apk_path }}" \
            "${{ steps.verify.outputs.checksum_path }}" \
            "${{ steps.verify.outputs.component_path }}" \
            "${{ steps.verify.outputs.component_checksum_path }}" \
            "${{ steps.verify.outputs.manifest_path }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Orbit Assistant v${{ steps.source.outputs.display_name }}" \
            --notes-file "${{ steps.notes.outputs.notes_path }}" \
            "${prerelease_args[@]}"

      - name: Remove temporary release keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/orbit-release.jks"
