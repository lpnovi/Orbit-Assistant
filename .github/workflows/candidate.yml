name: Candidate Orbit APK

# Builds an installable, permanently signed Orbit APK from a candidate branch so a device-specific
# interaction fix can be tested on real hardware BEFORE anything is published.
#
# This workflow deliberately publishes nothing: no tag, no GitHub Release, no orbit-update.json,
# no change to what the in-app updater sees. The signed APK is a build artifact on the run, and
# nothing about it reaches users until a normal tagged release is made from main.

on:
  push:
    branches:
      - 'candidate/**'
  workflow_dispatch:

# Read-only. The release workflow needs contents: write to publish; a candidate never does.
permissions:
  contents: read

concurrency:
  group: orbit-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PACKAGE_NAME: com.orbit.assistant
  EXPECTED_CERT_SHA256: 7D:AD:61:93:85:DF:F1:1E:C7:31:AA:55:5F:2B:44:8A:94:3C:73:91:81:3D:1A:94:DF:1C:B4:23:2E:CD:41:E3

jobs:
  candidate:
    name: Build and verify signed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v7

      - name: Read source version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)"
          source_version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"
          if [[ -z "${source_version_name}" || ! "${source_version_code}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle."
            exit 1
          fi
          echo "version_name=${source_version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${source_version_code}" >> "${GITHUB_OUTPUT}"
          echo "Candidate source version: ${source_version_name} (${source_version_code})"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare temporary release keystore
        shell: bash
        env:
          ORBIT_RELEASE_KEYSTORE_B64: ${{ secrets.ORBIT_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ORBIT_RELEASE_KEYSTORE_B64:-}" ]]; then
            echo "::error::Release keystore secret is unavailable."
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/orbit-release.jks"
          printf '%s' "${ORBIT_RELEASE_KEYSTORE_B64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          if [[ ! -s "${keystore_path}" ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi

      - name: Build signed candidate APK
        shell: bash
        env:
          ORBIT_RELEASE_STORE_FILE: ${{ runner.temp }}/orbit-release.jks
          ORBIT_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_STORE_PASSWORD }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify candidate APK
        id: verify
        shell: bash
        env:
          EXPECTED_VERSION_NAME: ${{ steps.source.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.source.outputs.version_code }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${apk_path}" ]]; then
            echo "::error::Candidate APK was not produced."
            exit 1
          fi

          build_tools_dir="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="${build_tools_dir}/aapt"
          apksigner="${build_tools_dir}/apksigner"
          if [[ ! -x "${aapt}" || ! -x "${apksigner}" ]]; then
            echo "::error::Required Android APK verification tools are unavailable."
            exit 1
          fi

          package_line="$("${aapt}" dump badging "${apk_path}" | grep -m 1 '^package:')"
          actual_package="$(awk -F"'" '{print $2}' <<< "${package_line}")"
          actual_version_code="$(awk -F"'" '{print $4}' <<< "${package_line}")"
          actual_version_name="$(awk -F"'" '{print $6}' <<< "${package_line}")"

          if [[ "${actual_package}" != "${EXPECTED_PACKAGE_NAME}" ]]; then
            echo "::error::APK package name verification failed."
            exit 1
          fi
          if [[ "${actual_version_name}" != "${EXPECTED_VERSION_NAME}" || "${actual_version_code}" != "${EXPECTED_VERSION_CODE}" ]]; then
            echo "::error::APK version verification failed."
            exit 1
          fi

          # The candidate has to be signed with the same permanent certificate as a real release,
          # or it will not install over the user's existing Orbit.
          signature_report="${RUNNER_TEMP}/orbit-apksigner-report.txt"
          "${apksigner}" verify --verbose --print-certs "${apk_path}" > "${signature_report}" 2>&1
          signer_count="$(grep -ciF 'certificate SHA-256 digest:' "${signature_report}" || true)"
          actual_cert="$(grep -iF 'certificate SHA-256 digest:' "${signature_report}" | head -n 1 | sed 's/.*digest:[[:space:]]*//' || true)"
          normalized_actual_cert="$(tr -d ':' <<< "${actual_cert}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          normalized_expected_cert="$(tr -d ':' <<< "${EXPECTED_CERT_SHA256}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          display_actual_cert="$(sed 's/../&:/g; s/:$//' <<< "${normalized_actual_cert}" | tr '[:lower:]' '[:upper:]')"
          echo "Detected APK signer count: ${signer_count}"
          echo "Detected certificate SHA-256: ${display_actual_cert:-unavailable}"
          if [[ "${signer_count}" != '1' ]]; then
            echo "::error::APK signer-count verification failed."
            exit 1
          fi
          if [[ "${normalized_actual_cert}" != "${normalized_expected_cert}" ]]; then
            echo "::error::APK signing certificate verification failed."
            exit 1
          fi

          output_dir="${GITHUB_WORKSPACE}/candidate-assets"
          short_sha="$(git rev-parse --short=12 HEAD)"
          output_apk="${output_dir}/Orbit-Candidate-v${EXPECTED_VERSION_NAME}-${short_sha}.apk"
          mkdir -p "${output_dir}"
          cp "${apk_path}" "${output_apk}"
          (
            cd "${output_dir}"
            sha256sum "$(basename "${output_apk}")" > "$(basename "${output_apk}").sha256"
          )

          {
            echo "Orbit Assistant candidate build"
            echo "branch: ${GITHUB_REF_NAME}"
            echo "commit: $(git rev-parse HEAD)"
            echo "versionName: ${actual_version_name}"
            echo "versionCode: ${actual_version_code}"
            echo "package: ${actual_package}"
            echo "certificateSha256: ${EXPECTED_CERT_SHA256}"
            echo "apkSha256: $(sha256sum "${output_apk}" | awk '{print $1}')"
            echo
            echo "This is a candidate build for physical testing only."
            echo "It is signed with the permanent Orbit certificate so it installs over a release,"
            echo "but it has not been published and the in-app updater does not know about it."
          } > "${output_dir}/CANDIDATE-INFO.txt"

          echo "artifact_name=Orbit-Candidate-${EXPECTED_VERSION_NAME}-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "output_dir=${output_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: ${{ steps.verify.outputs.output_dir }}
          if-no-files-found: error

      - name: Remove temporary release keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/orbit-release.jks"
